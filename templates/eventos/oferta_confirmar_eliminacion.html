{% extends 'base.html' %}
{% block title %}Eliminar oferta{% endblock %}
{% block content %}
<section class="page-header">
    <h1 class="display-6 fw-bold mb-2">Eliminar oferta laboral</h1>
    <p>¿Confirmas que deseas eliminar la oferta «{{ oferta.titulo }}»?</p>
</section>
<form method="post" class="my-4">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Eliminar oferta</button>
    <a class="btn btn-outline-secondary" href="{% url 'oferta_lista' %}">Cancelar</a>
</form>
{% endblock %}
